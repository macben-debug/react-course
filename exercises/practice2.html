<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
     
     function ProductDetails({name,price,Discount,imageSrc}){
        return (
            <>
             <div>
                <img src={imageSrc} width="150"/>
             </div>
             <p> {name}</p>
               
               {Discount?<p><del> Price: {price}</del></p>: <p> Price: {price}</p>}
                {Discount && <p> Discount price: {Discount}</p>}
                
                <button>
                    Add to cart
                </button>
            </>
        );
     }

     function App(){
      return( 
        <> 
           <ProductDetails 
                name="Cotton socks"
                price="$10.90"
                Discount="$5.45"
                imageSrc="cotton-socks.png"
            />

            <ProductDetails 
                name="Tennis balls"
                price="$6.00"
                imageSrc="tennis-balls.png"
            />

            <ProductDetails 
                name="Plain T-Shirt"
                price="$7.99"
                imageSrc="plain-t-shirt.png"
            />
        </>
      );
     }
    

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
